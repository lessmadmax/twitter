# 실행할 서비스(컨테이너)들을 정의
services:
  # Spring Boot 서비스 이름
  springboot-twitter:
    # 실제 생성되는 컨테이너 이름
    container_name: springboot-twitter

    # 컨테이너 생성에 사용할 이미지
    # 앞서 docker build로 만든 이미지
    image: springboot-twitter:latest

    # 내 컴퓨터와 컨테이너 사이의 포트 연결 설정
    ports:
      # 내 컴퓨터의 8080 → 컨테이너의 8080
      - "8080:8080"

    # 컨테이너 안에 전달할 환경변수
    environment:
      # Spring Boot가 접속할 MySQL 주소
      # mysql-twitter: MySQL 서비스 이름
      # 3306: MySQL 컨테이너 내부 포트
      # twitterdb: 사용할 데이터베이스 이름
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-twitter:3306/twitterdb

      # 데이터베이스 접속 계정
      - SPRING_DATASOURCE_USERNAME=dev

      # 데이터베이스 접속 비밀번호
      - SPRING_DATASOURCE_PASSWORD=dev123

    # 이 서비스가 연결될 네트워크
    networks:
      - twitter-network

    # Spring Boot보다 먼저 시작할 서비스
    depends_on:
      - mysql-twitter

  # MySQL 서비스 이름
  mysql-twitter:
    # 실제 생성되는 컨테이너 이름
    container_name: mysql-twitter

    # MySQL 9.3 이미지 사용
    image: mysql:9.3

    # MySQL 초기 설정에 사용할 환경변수
    environment:
      # MySQL 관리자 계정(root)의 비밀번호
      MYSQL_ROOT_PASSWORD: root123

      # 초기화할 때 생성할 데이터베이스 이름
      MYSQL_DATABASE: twitterdb

      # 초기화할 때 생성할 일반 사용자 계정
      MYSQL_USER: dev

      # 해당 사용자의 비밀번호
      MYSQL_PASSWORD: dev123

    # 내 컴퓨터와 MySQL 컨테이너 사이의 포트 연결
    ports:
      # 내 컴퓨터의 3306 → 컨테이너의 3306
      - "3306:3306"

    # Spring Boot와 같은 네트워크에 연결
    networks:
      - twitter-network

# 서비스들이 사용할 네트워크 정의
networks:
  # 위의 서비스들이 참조하는 네트워크 이름
  twitter-network:
    # 같은 Docker 호스트 안에서 컨테이너들을 연결하는 네트워크 방식
    driver: bridge